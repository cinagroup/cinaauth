packages:
  - apps/*
  - workers/*
  - packages/*
  - docs
  - e2e/**
  - demo/*
  - test

overrides:
  # Match the ESM schema registry used by SimpleWebAuthn's signature parser.
  '@simplewebauthn/server>@peculiar/asn1-ecc': 2.8.0
  '@base-org/account>@coinbase/cdp-sdk': 1.52.0
  '@reown/appkit-adapter-wagmi>@wagmi/connectors': 6.2.0
  kysely: 0.28.17
  zod@>=4: 4.6.7
  axios: '>=1.18.0 <2'
  test-exclude@<7: '>=7.0.1 <8'
  ip-address@<=10.1.0: ^10.2.0
  fast-xml-parser@: 5.12.0
  h3@<2: ^1.15.11
  h3-v2: 'npm:h3@^2.0.1-rc.15'
  minimatch@<10: '>=10.2.4 <11'
  cookie@<0.7.0: '>=0.7.2 <0.8'
  esbuild@<0.28.1: '>=0.28.1 <0.29'
  path-to-regexp@>=8: 8.4.0
  undici@>=7 <7.29.1: '>=7.29.1 <8'
  '@hono/node-server@<2.0.5': '>=2.0.5 <3'
  postcss@<8.5.18: '>=8.5.18 <9'
  'ws@<7.5.11': '>=7.5.11 <8'
  uuid@<11.1.1: '>=11.1.1 <12'
  'valibot@<1.4.2': '>=1.4.2 <2'
  sharp: '>=0.35.5 <0.36'
  # better-sqlite3 12.10.0 added Node 26 support.
  'better-sqlite3@>=12 <12.10.0': '>=12.10.0 <13'
  # chromium-edge-launcher depends on @types/node "*". Keep it on the root version so peer variants stay aligned with demo/nextjs.
  chromium-edge-launcher>@types/node: 25.9.4
  # vinxi pulls in vite 6, and pnpm would reuse it for the vite peer of vitest.
  vitest>vite: ^8.0.0
  # prisma pins mysql2 to an exact version below the security fix.
  prisma>mysql2: ^3.23.1

# Next's declarations import React from its virtual store location. Declaring
# the type peers keeps that resolution aligned with each consuming app instead
# of the workspace's unrelated optional React 18 fixture.
packageExtensions:
  # drizzle-kit has no drizzle-orm peer and must use the consuming workspace's version.
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
  # The new Kit migration API requires a modern libSQL client, not the legacy
  # 0.8 client used by the separate Kysely adapter fixture.
  'drizzle-kit@1.0.0-rc.6':
    dependencies:
      '@libsql/client': 0.17.4
  'next@>=16.2.11 <17':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  'next@>=15.5.23 <16':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  '@tanstack/react-query@>=5 <6':
    peerDependencies:
      '@types/react': '>=18.2.0'
  'cmdk@>=1 <2':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  'next-themes@>=0.4 <1':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  # The Zod resolver imports zod/v4 directly but does not declare Zod as a
  # peer, which breaks strict pnpm/Turbopack resolution in consuming apps.
  '@hookform/resolvers@>=5 <6':
    peerDependencies:
      zod: '>=3.25.0'
    peerDependenciesMeta:
      zod:
        optional: true

catalog:
  '@better-auth/utils': 0.5.1
  '@better-fetch/fetch': 1.3.3
  better-call: 1.4.6
  kysely: ^0.28.17 || ^0.29.0
  nanostores: ^1.3.0
  tsdown: 0.23.1
  typescript: ^6.0.3
  zod: ^4.5.4

catalogs:
  peer:
    '@better-auth/utils': ^0.4.2 || ^0.5.0
    # better-call has shipped breaking type changes in minor releases.
    better-call: ~1.4.5
    kysely: ^0.28.5 || ^0.29.0
    nanostores: ^1.0.1
  react19:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.3.1
    react-dom: ^19.3.1
  tailwind:
    '@tailwindcss/postcss': ^4.3.1
    tailwindcss: ^4.3.1
    tailwindcss-animate: ^1.0.7
  vitest:
    '@vitest/coverage-istanbul': ^5.1.0
    '@vitest/ui': ^5.1.0
    vitest: ^5.1.0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tsparticles/engine': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  less: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  'unrs-resolver@1.12.2': true
  workerd: true
  electron: false
  electron-winstaller: false
  # AppKit's postinstall only checks package-version alignment; the two direct
  # AppKit dependencies are pinned together and verified by repository tests.
  '@reown/appkit': false
  # Optional native accelerators are unnecessary in the browser/Worker bundle.
  bufferutil: false
  keccak: false
  utf-8-validate: false

linkWorkspacePackages: true

autoDedupe: true

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cinaauth/*'
  - '@better-fetch/fetch'
  - 'better-call'

patchedDependencies:
  '@changesets/assemble-release-plan': patches/@changesets__assemble-release-plan.patch

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200

trustedDependencies:
  - esbuild
  - workerd

onlyBuiltDependencies:
  - esbuild
  - workerd
  - better-sqlite3
  - sharp
  - msw
  - electron
  - lefthook
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@parcel/watcher"
  - "@swc/core"
  - protobufjs
