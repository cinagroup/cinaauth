name: Deploy Account Portal

on:
  push:
    branches: [main]
    paths:
      - apps/account-portal/**
      - packages/auth-proxy/**
      - packages/auth-web-contract/**
      - packages/design-tokens/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-account-portal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy accounts.cinaseek.ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/account-portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINAAUTH_ACCOUNT_SECRET: ${{ secrets.CINAAUTH_DEMO_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test "${#CINAAUTH_ACCOUNT_SECRET}" -ge 32 || (echo "CINAAUTH_DEMO_SECRET must be at least 32 characters" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck account portal
        run: pnpm run typecheck

      - name: Test account portal contracts
        run: pnpm exec vitest run middleware.test.ts lib/auth-api.test.ts lib/auth-capabilities.test.ts lib/admin-access.test.ts lib/oidc-navigation.test.ts

      - name: Test and check OAuth build parity
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          pnpm run test:oauth-build
          pnpm run check:oauth-build

      - name: Build for Cloudflare
        run: pnpm run build:cf
        env:
          CINAAUTH_URL: https://auth.cinaseek.ai
          NEXT_PUBLIC_CINAAUTH_API_URL: https://accounts.cinaseek.ai
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Inject account portal secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINAAUTH_SECRET: ${{ secrets.CINAAUTH_DEMO_SECRET }}
        run: echo "$CINAAUTH_SECRET" | pnpm exec wrangler secret put CINAAUTH_SECRET

      - name: Deploy account portal
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/account-portal
          command: deploy

      - name: Smoke test account portal
        run: |
          curl --fail-with-body --show-error --silent --retry 10 --retry-all-errors --retry-delay 6 https://accounts.cinaseek.ai/
          curl --fail-with-body --show-error --silent --retry 10 --retry-all-errors --retry-delay 6 https://accounts.cinaseek.ai/api/auth/get-session
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://demo-auth.cinagroup.com/)" = "308"
