name: Delivery Provider Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status only reads state; repair stages, tests, and activates Cloudflare Email"
        required: true
        type: choice
        options:
          - status
          - repair
      sender:
        description: "Verified sender, e.g. CinaSeek <no-reply@cinaseek.ai>"
        required: false
        type: string
      test_recipient:
        description: "Inbox that receives the real provider test email (repair mode)"
        required: false
        type: string

permissions: {}

jobs:
  repair:
    name: Read or restore the delivery email provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELIVERY_ORIGIN: https://cinauth-delivery.cinagroup.com
      DELIVERY_SECRET: ${{ secrets.CINAAUTH_DELIVERY_WEBHOOK_SECRET }}
    steps:
      - name: Fail closed without the shared delivery secret
        run: test -n "$DELIVERY_SECRET" || (echo "Missing CINAAUTH_DELIVERY_WEBHOOK_SECRET" && exit 1)

      - name: Run the delivery configuration control plane
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          SENDER: ${{ inputs.sender }}
          TEST_RECIPIENT: ${{ inputs.test_recipient }}
        run: |
          cat > /tmp/repair.mjs <<'SCRIPT'
          const origin = process.env.DELIVERY_ORIGIN;
          const secret = process.env.DELIVERY_SECRET;
          const encoder = new TextEncoder();

          const hmac = async (payload) => {
            const key = await crypto.subtle.importKey(
              "raw",
              encoder.encode(secret),
              { name: "HMAC", hash: "SHA-256" },
              false,
              ["sign"],
            );
            const signature = await crypto.subtle.sign("HMAC", key, encoder.encode(payload));
            return [...new Uint8Array(signature)]
              .map((byte) => byte.toString(16).padStart(2, "0"))
              .join("");
          };

          const call = async (action, body) => {
            const rawBody = JSON.stringify(body);
            const deliveryId = `${action}-${Date.now()}-${crypto.randomUUID().slice(0, 8)}`;
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const signature = await hmac(`${timestamp}.${deliveryId}.${rawBody}`);
            const response = await fetch(`${origin}/cinaauth/delivery/config/${action}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${secret}`,
                "Content-Type": "application/json",
                "X-CinaAuth-Delivery-Id": deliveryId,
                "X-CinaAuth-Delivery-Timestamp": timestamp,
                "X-CinaAuth-Delivery-Signature": `v1=${signature}`,
              },
              body: rawBody,
            });
            const text = await response.text();
            console.log(`== ${action} -> HTTP ${response.status}`);
            console.log(text);
            if (!response.ok) throw new Error(`${action} failed with HTTP ${response.status}`);
            return JSON.parse(text);
          };

          const status = await call("status", {});
          if (process.env.MODE !== "repair") {
            console.log("Status-only run complete.");
            process.exit(0);
          }

          const token = process.env.CF_EMAIL_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const sender = process.env.SENDER;
          const recipient = process.env.TEST_RECIPIENT;
          for (const [name, value, check] of [
            ["CLOUDFLARE_EMAIL_API_TOKEN", token, /^[A-Za-z0-9_-]{20,512}$/.test(token ?? "")],
            ["CLOUDFLARE_ACCOUNT_ID", accountId, /^[a-fA-F0-9]{32}$/.test(accountId ?? "")],
            ["sender input", sender, typeof sender === "string" && sender.length > 3],
            ["test_recipient input", recipient, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient ?? "")],
          ]) {
            if (!check) throw new Error(`Missing or invalid ${name}`);
          }

          await call("stage", {
            expectedVersion: status.revision,
            idempotencyKey: `repair-stage-${Date.now()}`,
            channel: "email",
            config: {
              provider: "cloudflare-email",
              apiToken: token,
              accountId,
              from: sender,
            },
          });

          const afterStage = await call("status", {});
          await call("test", {
            expectedVersion: afterStage.revision,
            idempotencyKey: `repair-test-${Date.now()}`,
            channel: "email",
            recipient,
          });

          const afterTest = await call("status", {});
          await call("activate", {
            expectedVersion: afterTest.revision,
            idempotencyKey: `repair-activate-${Date.now()}`,
            channel: "email",
            confirmation: "ACTIVATE",
          });

          const ready = await fetch(`${origin}/ready`);
          console.log(`== /ready -> HTTP ${ready.status}`);
          console.log(JSON.stringify(await ready.json(), null, 2));
          if (ready.status !== 200) throw new Error("Delivery worker is not ready after activation");
          console.log("Cloudflare Email is active for verification codes.");
          SCRIPT
          node /tmp/repair.mjs
