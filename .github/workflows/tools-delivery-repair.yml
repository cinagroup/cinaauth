name: Delivery Provider Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status reads state; reset rotates the shared webhook secret into the Secrets Store; repair stages, tests, and activates Cloudflare Email"
        required: true
        type: choice
        options:
          - status
          - reset
          - repair
      sender:
        description: "Verified sender, e.g. no-reply@cinaseek.ai"
        required: false
        type: string
      test_recipient:
        description: "Inbox that receives the real provider test email (repair mode)"
        required: false
        type: string

permissions: {}

jobs:
  repair:
    name: Read or restore the delivery email provider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELIVERY_ORIGIN: https://cinaauth-delivery.cinagroup.com
      DELIVERY_SECRET: ${{ secrets.CINAAUTH_DELIVERY_WEBHOOK_SECRET }}
    steps:
      - name: Fail closed without the shared delivery secret
        run: test -n "$DELIVERY_SECRET" || (echo "Missing CINAAUTH_DELIVERY_WEBHOOK_SECRET" && exit 1)

      - name: Checkout code
        if: inputs.mode == 'reset'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rotate the shared webhook secret in the Secrets Store
        if: inputs.mode == 'reset'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/reset.mjs <<'SCRIPT'
          import { readFileSync } from "node:fs";

          const token = process.env.CF_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const newSecret = process.env.DELIVERY_SECRET;
          if (!token || !accountId) throw new Error("Missing Cloudflare credentials");
          if (typeof newSecret !== "string" || newSecret.length < 32) {
            throw new Error("The replacement webhook secret must be at least 32 characters");
          }
          if (!/^[\x21-\x7e]+$/.test(newSecret)) {
            throw new Error("The replacement webhook secret must be printable ASCII");
          }

          const wrangler = JSON.parse(
            readFileSync("workers/auth-api/wrangler.json", "utf8"),
          );
          const entry = (wrangler.secrets_store_secrets ?? []).find(
            (item) => item.binding === "CINAAUTH_DELIVERY_WEBHOOK_SECRET_STORE_V2",
          );
          if (!entry) throw new Error("Secrets Store binding not found in wrangler.json");

          const api = async (path, init = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(init.headers ?? {}),
              },
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              throw new Error(
                `Cloudflare API ${response.status} on ${path}: ${JSON.stringify(payload?.errors ?? payload)}`,
              );
            }
            return payload;
          };

          const body = JSON.stringify({
            name: entry.secret_name,
            value: newSecret,
            scopes: ["workers"],
          });
          let stored = false;
          try {
            await api(
              `/accounts/${accountId}/secrets_store/stores/${entry.store_id}/secrets/${entry.secret_name}`,
              { method: "PUT", body },
            );
            stored = true;
          } catch (error) {
            console.log(`PUT update was not accepted (${error.message}); trying POST create`);
          }
          if (!stored) {
            await api(
              `/accounts/${accountId}/secrets_store/stores/${entry.store_id}/secrets`,
              { method: "POST", body },
            );
          }
          console.log(
            `Secret ${entry.secret_name} stored in Secrets Store ${entry.store_id}.`,
          );
          SCRIPT
          node /tmp/reset.mjs

      - name: Run the delivery configuration control plane
        if: inputs.mode != 'reset'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          SENDER: ${{ inputs.sender }}
          TEST_RECIPIENT: ${{ inputs.test_recipient }}
        run: |
          cat > /tmp/repair.mjs <<'SCRIPT'
          const origin = process.env.DELIVERY_ORIGIN;
          const secret = process.env.DELIVERY_SECRET;
          const encoder = new TextEncoder();

          const hmac = async (payload) => {
            const key = await crypto.subtle.importKey(
              "raw",
              encoder.encode(secret),
              { name: "HMAC", hash: "SHA-256" },
              false,
              ["sign"],
            );
            const signature = await crypto.subtle.sign("HMAC", key, encoder.encode(payload));
            return [...new Uint8Array(signature)]
              .map((byte) => byte.toString(16).padStart(2, "0"))
              .join("");
          };

          const call = async (action, body) => {
            const rawBody = JSON.stringify(body);
            const deliveryId = `${action}-${Date.now()}-${crypto.randomUUID().slice(0, 8)}`;
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const signature = await hmac(`${timestamp}.${deliveryId}.${rawBody}`);
            const response = await fetch(`${origin}/cinaauth/delivery/config/${action}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${secret}`,
                "Content-Type": "application/json",
                "X-CinaAuth-Delivery-Id": deliveryId,
                "X-CinaAuth-Delivery-Timestamp": timestamp,
                "X-CinaAuth-Delivery-Signature": `v1=${signature}`,
              },
              body: rawBody,
            });
            const text = await response.text();
            console.log(`== ${action} -> HTTP ${response.status}`);
            console.log(text);
            if (!response.ok) throw new Error(`${action} failed with HTTP ${response.status}`);
            return JSON.parse(text);
          };

          const status = await call("status", {});
          if (process.env.MODE !== "repair") {
            console.log("Status-only run complete.");
            process.exit(0);
          }

          const token = process.env.CF_EMAIL_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const sender = process.env.SENDER;
          const recipient = process.env.TEST_RECIPIENT;
          for (const [name, value, check] of [
            ["CLOUDFLARE_EMAIL_API_TOKEN", token, /^[A-Za-z0-9_-]{20,512}$/.test(token ?? "")],
            ["CLOUDFLARE_ACCOUNT_ID", accountId, /^[a-fA-F0-9]{32}$/.test(accountId ?? "")],
            ["sender input", sender, typeof sender === "string" && sender.length > 3],
            ["test_recipient input", recipient, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient ?? "")],
          ]) {
            if (!check) throw new Error(`Missing or invalid ${name}`);
          }

          await call("stage", {
            expectedVersion: status.revision,
            idempotencyKey: `repair-stage-${Date.now()}`,
            channel: "email",
            config: {
              provider: "cloudflare-email",
              apiToken: token,
              accountId,
              from: sender,
            },
          });

          const afterStage = await call("status", {});
          await call("test", {
            expectedVersion: afterStage.revision,
            idempotencyKey: `repair-test-${Date.now()}`,
            channel: "email",
            recipient,
          });

          const afterTest = await call("status", {});
          await call("activate", {
            expectedVersion: afterTest.revision,
            idempotencyKey: `repair-activate-${Date.now()}`,
            channel: "email",
            confirmation: "ACTIVATE",
          });

          const ready = await fetch(`${origin}/ready`);
          console.log(`== /ready -> HTTP ${ready.status}`);
          console.log(JSON.stringify(await ready.json(), null, 2));
          if (ready.status !== 200) throw new Error("Delivery worker is not ready after activation");
          console.log("Cloudflare Email is active for verification codes.");
          SCRIPT
          node /tmp/repair.mjs

      - name: Verify the rotated secret end to end
        if: inputs.mode == 'reset'
        run: |
          cat > /tmp/verify.mjs <<'SCRIPT'
          const origin = process.env.DELIVERY_ORIGIN;
          const secret = process.env.DELIVERY_SECRET;
          const encoder = new TextEncoder();
          const rawBody = "{}";
          const deliveryId = `verify-${Date.now()}`;
          const timestamp = Math.floor(Date.now() / 1000).toString();
          const key = await crypto.subtle.importKey(
            "raw",
            encoder.encode(secret),
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"],
          );
          const signature = await crypto.subtle.sign(
            "HMAC",
            key,
            encoder.encode(`${timestamp}.${deliveryId}.${rawBody}`),
          );
          const hex = [...new Uint8Array(signature)]
            .map((byte) => byte.toString(16).padStart(2, "0"))
            .join("");
          const response = await fetch(`${origin}/cinaauth/delivery/config/status`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${secret}`,
              "Content-Type": "application/json",
              "X-CinaAuth-Delivery-Id": deliveryId,
              "X-CinaAuth-Delivery-Timestamp": timestamp,
              "X-CinaAuth-Delivery-Signature": `v1=${hex}`,
            },
            body: rawBody,
          });
          console.log(`== status with rotated secret -> HTTP ${response.status}`);
          console.log(await response.text());
          if (response.status !== 200) throw new Error("Rotated secret is not accepted yet");
          SCRIPT
          node /tmp/verify.mjs
